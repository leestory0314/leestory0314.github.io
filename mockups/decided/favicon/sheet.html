<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Favicon options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#e9eaee;font-family:Inter,system-ui,sans-serif;color:#1d1d1f;padding:28px}
  .row{display:grid;grid-template-columns:150px 1fr 420px;gap:28px;align-items:center;background:#fff;border-radius:18px;padding:22px 28px;margin-bottom:16px}
  .row h3{margin:0 0 4px;font-size:15px;font-weight:600}.row h3 b{color:#0a58e0;margin-right:8px}
  .row p{margin:0;font-size:12.5px;color:#6e6e73;line-height:1.45}
  .sizes{display:flex;align-items:flex-end;gap:26px}
  .sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:#6e6e73}
  img{display:block}
  .tabs{background:#dee1e6;border-radius:10px 10px 0 0;padding:8px 8px 0;display:flex;gap:4px}
  .tab{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px 8px 0 0;padding:8px 12px;font-size:12px;width:200px;white-space:nowrap;overflow:hidden}
  .tab.dim{background:#eceef1;color:#5f6368}
  .tab span{overflow:hidden;text-overflow:ellipsis}
  .bar{background:#fff;height:34px;border-radius:0 0 10px 10px;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#5f6368;gap:8px}
  .bar i{display:inline-block;width:260px;height:20px;background:#f1f3f4;border-radius:10px}
  .dark .tabs{background:#202124}.dark .tab{background:#35363a;color:#e8eaed}.dark .tab.dim{background:#292a2d;color:#9aa0a6}.dark .bar{background:#35363a}.dark .bar i{background:#202124}
</style></head><body>
<script>
  var opts=[
    ['f1','L · Block','L 모티브 — 굵은 기하학 L 을 파랑 바탕에 흰색으로. 16px 에서도 글자가 살아 있는 가장 직관적인 안.'],
    ['f2','L · Node','L 모티브 — 헤더 마크와 같은 노드·링크 문법으로 L 을 그림. 꺾이는 지점의 파란 노드가 메시 그래픽과 이어짐.'],
    ['f3','L · Cut','L 모티브 — 정사각형에서 한 칸을 떼어낸 네거티브 L. 떼어낸 칸이 파란 포인트가 됨. 가장 건축적.'],
    ['f4','Mesh','자유 — 헤더의 노드 트라이앵글을 그대로 아이콘으로. 사이트 전체와 한 몸이 되는 안.'],
    ['f5','Goal','자유 — 히어로 카피 "The goal doesn’t." 의 목표 기호. 트인 고리와 중심점, 사이트의 메시지를 아이콘에 담음.']
  ];
  opts.forEach(function(o,i){
    var dark=i%2?' dark':'';
    document.write('<div class="row"><div><h3><b>'+(i+1)+'</b>'+o[1]+'</h3><p>'+o[2]+'</p></div>'+
      '<div class="sizes">'+[128,48,32,16].map(function(s){return '<figure><img src="'+o[0]+'.svg" width="'+s+'" height="'+s+'"><span>'+s+'px</span></figure>'}).join('')+'</div>'+
      '<div class="'+dark+'"><div class="tabs"><div class="tab"><img src="'+o[0]+'.svg" width="16" height="16"><span>Cloud Native Architect · AI Technologist · Builder</span></div><div class="tab dim"><img src="https://github.githubassets.com/favicons/favicon.svg" width="16" height="16"><span>GitHub</span></div></div><div class="bar">leestory.com <i></i></div></div></div>');
  });
</script>
</body></html>
